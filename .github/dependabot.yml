version: 2
updates:
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(docs-deps)"
    groups:
      docs-patch:
        patterns: ["*"]
        update-types: ["patch"]
      docs-minor:
        patterns: ["*"]
        update-types: ["minor"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor"]

  - package-ecosystem: cargo
    directory: /tools/packaging
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(packaging-deps)"
    groups:
      packaging-patch:
        patterns: ["*"]
        update-types: ["patch"]
      packaging-minor:
        patterns: ["*"]
        update-types: ["minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-safe:
        patterns: ["*"]
        update-types: ["minor", "patch"]
