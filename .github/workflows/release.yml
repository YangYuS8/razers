name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z release to rebuild (leave empty for normal automation)
        required: false
        type: string

permissions: {}

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  automate:
    name: Maintain Release PR or publish approved release
    if: github.repository == 'YangYuS8/razers'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      package: ${{ steps.release.outputs.release_created == 'true' || inputs.tag != '' }}
      tag: ${{ steps.release.outputs.tag_name || inputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Update Release PR or create tag and GitHub Release
        id: release
        if: github.event_name != 'workflow_dispatch' || inputs.tag == ''
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh Cargo.lock in the Release PR
        id: release-branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$RELEASE_PR")
          git fetch origin "$branch"
          git switch --detach FETCH_HEAD
          cargo update --workspace
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Cargo.lock
            git commit -m "chore: refresh lockfile for release"
            git push origin "HEAD:$branch"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Approve CI for the bot-created Release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ steps.release-branch.outputs.sha }}
        run: |
          for attempt in {1..10}; do
            runs=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${RELEASE_SHA}&per_page=100" \
              --jq '.workflow_runs[] | [.id, .conclusion] | @tsv')
            if [[ -n "$runs" ]]; then
              while IFS=$'\t' read -r run_id conclusion; do
                if [[ "$conclusion" == "action_required" ]]; then
                  gh api --method POST \
                    "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"
                fi
              done <<<"$runs"
              exit 0
            fi
            sleep 2
          done
          echo "CI approval run did not appear for ${RELEASE_SHA}" >&2
          exit 1

  artifacts:
    needs: automate
    if: needs.automate.outputs.package == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/installers.yml
    with:
      ref: ${{ needs.automate.outputs.tag }}
      tag: ${{ needs.automate.outputs.tag }}

  publish:
    name: Publish the complete verified package set
    needs: [automate, artifacts]
    if: needs.automate.outputs.package == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ needs.automate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist
      - name: Require every expected asset and verify checksums
        env:
          RELEASE_TAG: ${{ needs.automate.outputs.tag }}
        run: python tools/verify_release.py dist --tag "$RELEASE_TAG"
      - name: Upload assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.automate.outputs.tag }}
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" dist/* --clobber
          python tools/update_release_notes.py --tag "$RELEASE_TAG"
      - name: Download and verify published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.automate.outputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --dir target/published-assets
          python tools/verify_release.py target/published-assets --tag "$RELEASE_TAG"
