name: Installer packages

on:
  workflow_call:
    inputs:
      ref:
        description: Source ref (empty uses the caller's checked commit)
        required: false
        type: string
        default: ''
      tag:
        description: Expected release tag (empty uses Cargo.toml)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    name: Install and remove (${{ matrix.target }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      RELEASE_TARGET: ${{ matrix.target }}
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install Linux build and package inspection tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libudev-dev libxkbcommon-dev makepkg pacman-package-manager libarchive-tools zstd desktop-file-utils
          # Ubuntu's makepkg package omits bsdtar and does not initialize the
          # read-only package inventory used to record .BUILDINFO.
          sudo install -d -m 755 /var/lib/pacman/local
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: installers-${{ matrix.target }}
          cache-on-failure: true
          workspaces: |
            . -> target
            tools/packaging -> ../../target/packaging-tool
      - name: Validate packaging tooling and desktop entry
        shell: bash
        run: |
          python -m unittest discover -s tools/tests
          if [[ "$RUNNER_OS" == Linux ]]; then
            desktop-file-validate tools/packaging/razers.desktop
          fi
      - name: Build the locked, isolated packaging tool
        run: cargo build --locked --manifest-path tools/packaging/Cargo.toml --target-dir target/packaging-tool
      - name: Build the three shipped binaries
        env:
          # Do not require end users to install a separate Visual C++ runtime.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
        run: cargo build --locked --release --package razers-app --package razers-agent --package razers-cli --target ${{ matrix.target }}
      - name: Package installers and portable archives
        shell: bash
        run: |
          build_tag=$(python -c 'import sys; sys.path.insert(0, "tools"); from package_installers import workspace_version; print("v" + workspace_version())')
          tag="${REQUESTED_TAG:-$build_tag}"
          packager="target/packaging-tool/debug/razers-packaging"
          if [[ "$RUNNER_OS" == Windows ]]; then packager="$packager.exe"; fi
          python tools/package_installers.py --tag "$tag" --target "$RELEASE_TARGET" --packager "$packager"
          python tools/package_release.py --tag "$tag" --target "$RELEASE_TARGET"
      - name: Verify payloads, install, upgrade, uninstall, and preserve preferences
        shell: bash
        run: |
          packager="target/packaging-tool/debug/razers-packaging"
          if [[ "$RUNNER_OS" == Windows ]]; then packager="$packager.exe"; fi
          python tools/check_installers.py --target "$RELEASE_TARGET" --lifecycle --packager "$packager"
      - name: Check dependencies in a clean Arch Linux userspace
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          docker run --rm -v "$PWD:/workspace:ro" archlinux:base bash -euc '
            pacman -Syu --noconfirm python
            pacman -U --noconfirm /workspace/dist/*.pkg.tar.zst
            python -c '\''import sys; from pathlib import Path; sys.path.insert(0, "/workspace/tools"); from check_installers import smoke_binaries; from package_installers import workspace_version; smoke_binaries(Path("/usr/bin"), workspace_version())'\''
            pacman -R --noconfirm razers
            test ! -e /usr/bin/razers
            test ! -e /usr/bin/razers-agent
            test ! -e /usr/bin/razersctl
          '
      - name: Save verified packages for the caller
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
