name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Bilingual docs and rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install --yes libudev-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: documentation
      - name: Install pinned mdBook
        run: |
          version=$(sed -n 's/^mdbook=//p' tools/docs-requirements.txt)
          if [ "$(target/mdbook/bin/mdbook --version 2>/dev/null)" != "mdbook v$version" ]; then
            CARGO_TARGET_DIR=target/mdbook-build cargo install mdbook --version "$version" --locked --root target/mdbook --force
          fi
      - name: Validate documentation tools
        run: python -m unittest discover -s tools/tests
      - name: Build and validate both languages and API docs
        env:
          MDBOOK: target/mdbook/bin/mdbook
        run: python tools/build_docs.py
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: target/site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
