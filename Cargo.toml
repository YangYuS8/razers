[workspace]
resolver = "3"
members = [
    "crates/razers-agent",
    "crates/razers-app",
    "crates/razers-cli",
    "crates/razers-device-registry",
    "crates/razers-ipc",
    "crates/razers-i18n",
    "crates/razers-protocol-core",
    "crates/razers-protocol-razer90",
    "crates/razers-transport",
    "crates/razers-transport-hidapi",
    "crates/razers-types",
]

[workspace.package]
version = "0.4.0" # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/YangYuS8/razers"
authors = ["YangYuS8 and RazeRS contributors"]

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sys-locale = "0.3.2"
thiserror = "2.0.20"
toml = "1.1.5"
hidapi = "2.6.7"
eframe = { version = "0.32.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11", "persistence"] }
razers-i18n = { path = "crates/razers-i18n" }
razers-device-registry = { path = "crates/razers-device-registry" }
razers-ipc = { path = "crates/razers-ipc" }
razers-protocol-core = { path = "crates/razers-protocol-core" }
razers-protocol-razer90 = { path = "crates/razers-protocol-razer90" }
razers-transport = { path = "crates/razers-transport" }
razers-transport-hidapi = { path = "crates/razers-transport-hidapi" }
razers-types = { path = "crates/razers-types" }
